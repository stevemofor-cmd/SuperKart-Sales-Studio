services:
  backend:
    build:
      context: .
      dockerfile: backend_files/Dockerfile
    environment:
      MODEL_PATH: /app/superkart_model.joblib
      PORT: "7860"
    ports:
      - "${BACKEND_HOST_PORT:-7860}:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend_files/Dockerfile
    environment:
      API_BASE_URL: http://backend:7860
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
